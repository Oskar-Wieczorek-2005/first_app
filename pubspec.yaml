name: sandwich_shop
description: "A Flutter project for a sandwich shop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/logo.png
    - lib/assets/images/veggie_delight.png
    - lib/assets/images/chicken_teriyaki.png
    - lib/assets/images/tuna_melt.png
    - lib/assets/images/meatball_marinara.png
